name: vetrota_mobile
description: VetRota — gezici veteriner offline-first mobil uygulama
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local DB
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # HTTP + storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  intl: ^0.19.0

  # Foto cekme + galeri (M4)
  image_picker: ^1.1.2

  # Harita + rota (M5)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # PDF aç/paylaş
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13

  # Uygulama simgesi (launcher icon) uretici
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Android + iOS launcher icon konfigurasyonu.
# Uretmek icin (Windows):
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo2.png"
  min_sdk_android: 21
