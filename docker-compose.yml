services:
  postgres:
    image: postgres:18-alpine
    container_name: vetrota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vetrota}
      POSTGRES_USER: ${DB_USERNAME:-vetrota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetrota}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vetrota} -d ${DB_DATABASE:-vetrota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: php:8.4-cli-alpine
    container_name: vetrota-backend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git unzip libpq-dev postgresql-dev oniguruma-dev icu-dev libzip-dev &&
        docker-php-ext-install pdo pdo_pgsql pgsql mbstring intl zip bcmath &&
        if [ ! -f /usr/local/bin/composer ]; then
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer;
        fi &&
        if [ -f composer.json ]; then composer install --no-interaction; fi &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vetrota}
      DB_USERNAME: ${DB_USERNAME:-vetrota}
      DB_PASSWORD: ${DB_PASSWORD:-vetrota}

  web:
    image: node:22-alpine
    container_name: vetrota-web
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else
          echo 'web/package.json yok — Nuxt projesi henuz kurulmadi (Adim 7).' && tail -f /dev/null;
        fi
      "
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${BACKEND_PORT:-8000}/api/v1

volumes:
  postgres_data:
    name: vetrota_postgres_data
