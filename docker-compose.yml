services:
  postgres:
    image: postgres:18-alpine
    container_name: vetrota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vetrota}
      POSTGRES_USER: ${DB_USERNAME:-vetrota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetrota}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vetrota} -d ${DB_DATABASE:-vetrota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vetrota-backend:local
    container_name: vetrota-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vetrota}
      DB_USERNAME: ${DB_USERNAME:-vetrota}
      DB_PASSWORD: ${DB_PASSWORD:-vetrota}

  web:
    image: node:22-alpine
    container_name: vetrota-web
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ]; then npm install --no-audit --no-fund; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${BACKEND_PORT:-8000}/api/v1
      NUXT_API_BASE_SERVER: http://backend:8000/api/v1
      HOST: 0.0.0.0

volumes:
  postgres_data:
    name: vetrota_postgres_data
